<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMSH Flow | AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- ДОБАВЛЕНО: Подключение Markdown парсера -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-wrapper">
        <!-- Боковое меню -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="icon-btn" onclick="createNewChat()" title="Новый чат">
                        <span class="material-symbols-outlined">add</span>
                    </button>
                    <button class="icon-btn" onclick="toggleSearch()" title="Поиск">
                        <span class="material-symbols-outlined">search</span>
                    </button>
                </div>
                
                <button class="icon-btn" onclick="toggleSidebar()" title="Свернуть меню">
                    <span class="material-symbols-outlined">dock_to_left</span>
                </button>
            </div>

            <div id="search-container" class="search-box hidden">
                <input type="text" id="sidebar-search-input" placeholder="Поиск чатов..." oninput="filterFlows(this.value)">
            </div>

            <!-- Список чатов -->
            <div id="chat-list"></div>

            <div class="sidebar-bottom">
                <button class="menu-btn" onclick="window.location.href='settings.html'">
                    <span class="material-symbols-outlined">settings</span> Настройки
                </button>
            </div>
        </nav>

        <!-- Основная область -->
        <main id="main-container">
            <!-- Шапка чата -->
            <header class="chat-header">
                <button class="icon-btn burger-btn" onclick="toggleSidebar()" title="Развернуть меню">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <span class="chat-title" id="current-chat-title">Штаб ЛМСХ</span>
            </header>

            <div class="chat-panel" id="chat-left">
                <div class="chat-messages" id="messages-left"></div>
            </div>
        </main>

        <!-- Поле ввода -->
        <footer class="master-input-wrapper">
            <div id="file-previews" class="file-previews-container"></div>

            <div class="master-input">
                <input type="file" id="file-input" style="display: none;" multiple 
                       accept="image/*,video/*,.js,.ts,.py,.html,.css,.json,.c,.cpp,.cs,.java,.php,.rb,.go,.rs,.sql,.pdf,audio/*" 
                       onchange="handleFileSelect(event)">

                <button id="attach-btn" class="input-action-btn" onclick="document.getElementById('file-input').click()" title="Прикрепить файлы">
                    <span class="material-symbols-outlined">attach_file</span>
                </button>

                <textarea id="master-input" rows="1" placeholder="Введите запрос..." onkeydown="handleKeyDown(event)" oninput="autoResizeTextarea(this)"></textarea>

                <div class="input-right-actions">
                    <button id="mic-btn" class="input-action-btn" onclick="toggleSpeechRecognition()" title="Голосовой ввод">
                        <span class="material-symbols-outlined">mic</span>
                    </button>
                    <button id="send-btn" class="input-action-btn primary" onclick="handleSendClick()" title="Отправить сообщение">
    <span class="material-symbols-outlined">send</span>
</button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Кастомное контекстное меню (ПКМ) -->
    <div id="context-menu" class="context-menu hidden">
        <div class="context-menu-item" onclick="renameCurrentContextMenuChat()">
            <span class="material-symbols-outlined">edit</span> Переименовать
        </div>
        <div class="context-menu-item danger" onclick="deleteCurrentContextMenuChat()">
            <span class="material-symbols-outlined">delete</span> Удалить
        </div>
    </div>

    <script src="core.js"></script>

    <!-- ДОБАВЛЕНО: Функции поиска для сайдбара -->
    <script>
        function toggleSearch() {
            const container = document.getElementById('search-container');
            if (container) {
                container.classList.toggle('hidden');
                if (!container.classList.contains('hidden')) {
                    document.getElementById('sidebar-search-input')?.focus();
                }
            }
        }

        function filterFlows(query) {
            const items = document.querySelectorAll('#chat-list .menu-item');
            const cleanQuery = query.toLowerCase().trim();

            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(cleanQuery)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

    function toggleSearch() {
        const container = document.getElementById('search-container');
        if (container) {
            container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) {
                const input = document.getElementById('sidebar-search-input');
                if (input) {
                    input.value = '';
                    input.focus();
                    renderSidebarFlows();
                }
            }
        }
    }

    function filterFlows(query) {
        const flows = getFlows();
        const cleanQuery = query.toLowerCase().trim();

        if (!cleanQuery) {
            renderSidebarFlows(flows);
            return;
        }

        const filtered = flows.filter(f => f.name.toLowerCase().includes(cleanQuery));
        renderSidebarFlows(filtered);
    }
    </script>
</body>
</html>
