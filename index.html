<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Official Flow 2.2 | Штаб ЛМСХ</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,700,1,0" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="sidebar">
        <div class="menu-item" onclick="createNewChat()">
            <span class="material-symbols-outlined">edit_square</span> 
            <span>Новый чат</span>
        </div>
        <div class="menu-item" onclick="toggleSplitView()">
            <span class="material-symbols-outlined">splitscreen_landscape_add</span> 
            <span>Split View</span>
        </div>
        <div class="user-footer">
            <span>Ламирк</span>
            <span class="material-symbols-outlined">settings</span>
        </div>
    </nav>

    <div id="main-container" class="app-grid">
        <div class="chat-panel" id="chat-left"></div>
        <div class="chat-panel hidden" id="chat-right"></div>
    </div>

    <div class="master-input">
        <input type="text" id="master-input" placeholder="[LMSH_FLOW_2.2]: Введите команду для Штаба...">
    </div>

    <script src="kombonation.js"></script>
    <script src="core.js"></script>
</body>
</html>
