<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    <style>
        :root { --bg: #0d0e11; --card: #17181f; --text: #e2e2e9; --primary: #adc6ff; --surface: #292a33; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        
        /* СИСТЕМА ЧАТОВ (СЛЕВА) */
        .sidebar { width: 260px; background: var(--card); border-right: 1px solid var(--surface); padding: 20px; }
        .chat-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; cursor: pointer; border-radius: 12px; }
        .chat-item:hover { background: var(--surface); }

        /* РИДЕР (СПРАВА) */
        .main-reader { flex: 1; display: flex; flex-direction: column; padding: 20px; align-items: center; }
        .reader-card { width: 100%; max-width: 600px; background: var(--card); padding: 20px; border-radius: 28px; }
        
        /* КНОПКА ОТПРАВКИ */
        #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .scan-animation { height: 2px; background: var(--primary); animation: scan 1.5s infinite; margin: 10px 0; display: none; }
        @keyframes scan { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        .reader-card { 
    width: 90%; 
    max-width: 500px; 
    background: #17181f; 
    padding: 25px; 
    border-radius: 24px; 
    border: 1px solid #333;
    margin-top: 50px; /* Отступ сверху */
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.input-group { display: flex; gap: 10px; width: 100%; }
    </style>
</head>

        <button class="btn btn-ask" onclick="processQuery()">Отправить</button>
    </div>
    <div id="response-area" style="color: var(--m3-primary);"></div>
</div>
