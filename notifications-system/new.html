<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Администратора | Prestige HQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-primary: #1d1b20;
            --text-secondary: #49454f;
            --accent-color: #6750a4;
            --accent-light: #e8def8;
            --border-color: #e7e0ec;
            --active-red: #b3261e;
            --active-green: #10b981;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body.dark-theme {
            --bg-color: #050505;
            --card-bg: #121214;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --accent-color: #d0bcff;
            --accent-light: #2d2640;
            --border-color: #26262a;
            --active-red: #f2b8b5;
            --active-green: #34d399;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-primary); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .admin-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 16px 24px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); }
        .admin-header h2 { font-size: 1.2em; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }

        .workspace { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .workspace { grid-template-columns: 1fr; } }

        .panel { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 15px; }
        .panel h3 { font-size: 1em; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85em; font-weight: 600; color: var(--text-secondary); }
        .form-control { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary); font-size: 0.9em; outline: none; }
        .form-control:focus { border-color: var(--accent-color); }

        /* Панель форматирования текста */
        .toolbar { display: flex; gap: 6px; background: var(--bg-color); padding: 6px; border-radius: 12px; border: 1px solid var(--border-color); flex-wrap: wrap; }
        .tool-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8em; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
        .tool-btn:hover { background: var(--accent-light); color: var(--accent-color); }

        textarea.form-control { resize: vertical; min-height: 180px; font-family: monospace; }

        .ai-qa-pair { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .ai-qa-pair input { flex: 1; }

        .main-btn { padding: 12px 20px; border-radius: 16px; border: none; background: var(--accent-color); color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; box-shadow: var(--card-shadow); }
        .main-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .back-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }

        .json-output { width: 100%; height: 120px; font-family: monospace; font-size: 0.75em; padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary); resize: none; }
    </style>
</head>
<body class="light-theme">

    <script>
        // Срочная проверка авторизации при загрузке страницы
        (function checkAdminAuth() {
            const isAuth = sessionStorage.getItem('lmsh_admin_auth') === 'true';
            if (!isAuth) {
                const email = prompt("Введите почту администратора:");
                const pass = prompt("Введите пароль администратора:");

                // Строгие данные для входа
                if (email === "lmsh@auth.io" && pass === "LMSH_Admin_2026_Secure!") {
                    sessionStorage.setItem('lmsh_admin_auth', 'true');
                    alert("Авторизация успешна! Добро пожаловать в Штаб ЛМСХ.");
                } else {
                    alert("Неверные данные! Действие было заблокировано.");
                    window.location.href = "index.html";
                }
            }
        })();
    </script>

    <div class="admin-container">
        <!-- Шапка -->
        <div class="admin-header">
            <h2><span class="material-symbols-outlined">admin_panel_settings</span> Конструктор Событий и Новостей</h2>
            <button class="main-btn back-btn" onclick="location.href='index.html'"><span class="material-symbols-outlined">arrow_back</span> На главную</button>
        </div>

        <!-- Рабочая зона редактора -->
        <div class="workspace">
            <!-- Левая колонка: Основной контент -->
            <div class="panel">
                <h3>📝 Основная информация</h3>
                
                <div class="form-group">
                    <label>Тип записи</label>
                    <select id="postType" class="form-control">
                        <option value="event">📅 Событие</option>
                        <option value="news">📰 Новость / Объявление</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ID записи (латиницей, например: update_v2)</label>
                    <input type="text" id="postId" class="form-control" placeholder="feature_name">
                </div>

                <div class="form-group">
                    <label>Заголовок</label>
                    <input type="text" id="postTitle" class="form-control" placeholder="Название события или новости">
                </div>

                <div class="form-group">
                    <label>Краткое описание (для карточки)</label>
                    <input type="text" id="postShort" class="form-control" placeholder="Пара предложений для предпросмотра">
                </div>

                <div class="form-group">
                    <label>Полный текст / Детали</label>
                    <!-- Панель форматирования -->
                    <div class="toolbar">
                        <button class="tool-btn" onclick="formatText('**', '**')"><b>B</b> Жирный</button>
                        <button class="tool-btn" onclick="formatText('*', '*')"><i>I</i> Курсив</button>
                        <button class="tool-btn" onclick="formatText('[Ссылка](url)')">🔗 Ссылка</button>
                        <button class="tool-btn" onclick="formatText('\n- ')">• Список</button>
                    </div>
                    <textarea id="postFull" class="form-control" placeholder="Подробное описание..."></textarea>
                </div>

                <div class="form-group">
                    <label>Ссылка кнопки действия (Action URL)</label>
                    <input type="text" id="postActionUrl" class="form-control" value="https://sites.google.com/view/kosmo-level-store/">
                </div>
            </div>

            <!-- Правая колонка: Даты и Настройка ИИ -->
            <div class="panel">
                <h3>⚙️ Даты и ИИ-Ассистент</h3>

                <div class="form-group">
                    <label>Статус даты</label>
                    <select id="dateMode" class="form-control" onchange="toggleDateInputs()">
                        <option value="exact">Точная дата</option>
                        <option value="tba">Дата уточняется (Скоро)</option>
                    </select>
                </div>

                <div id="exactDatesGroup" style="display: flex; flex-direction: column; gap: 10px;">
                    <div class="form-group">
                        <label>Дата начала</label>
                        <input type="date" id="dateStart" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Дата окончания</label>
                        <input type="date" id="dateEnd" class="form-control">
                    </div>
                </div>

                <h3>🤖 База знаний ИИ (Ask Event)</h3>
                <div class="form-group">
                    <label>Приветствие ИИ при открытии чата</label>
                    <input type="text" id="aiGreeting" class="form-control" value="Привет! Я твой ИИ-ассистент. Задай мне любой вопрос!">
                </div>

                <div class="form-group">
                    <label>Ключевые вопросы и ответы ИИ</label>
                    <div id="aiPairsContainer">
                        <div class="ai-qa-pair">
                            <input type="text" class="form-control ai-key" placeholder="Ключевое слово (например: цена)">
                            <input type="text" class="form-control ai-val" placeholder="Ответ ИИ">
                        </div>
                    </div>
                    <button class="tool-btn" onclick="addAiPair()" style="margin-top: 6px; width: fit-content;"><span class="material-symbols-outlined" style="font-size: 16px;">add</span> Добавить правило</button>
                </div>

                <div class="form-group" style="margin-top: auto;">
                    <label>Сгенерированный JSON для events.json</label>
                    <textarea class="json-output" id="jsonOutput" readonly placeholder="Здесь появится готовый JSON..."></textarea>
                    <button class="main-btn" onclick="generateJson()" style="margin-top: 8px;"><span class="material-symbols-outlined">code</span> Сгенерировать JSON</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация темы с учетом настроек index.html
        if (localStorage.getItem('site_theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }

        function toggleDateInputs() {
            const mode = document.getElementById('dateMode').value;
            document.getElementById('exactDatesGroup').style.display = mode === 'exact' ? 'flex' : 'none';
        }

        function formatText(wrapperBefore, wrapperAfter = '') {
            const textarea = document.getElementById('postFull');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + wrapperBefore + text.substring(start, end) + wrapperAfter + text.substring(end);
            textarea.focus();
            textarea.setSelectionRange(start + wrapperBefore.length, end + wrapperBefore.length);
        }

        function addAiPair() {
            const container = document.getElementById('aiPairsContainer');
            const div = document.createElement('div');
            div.className = 'ai-qa-pair';
            div.innerHTML = `
                <input type="text" class="form-control ai-key" placeholder="Ключевое слово">
                <input type="text" class="form-control ai-val" placeholder="Ответ ИИ">
            `;
            container.appendChild(div);
        }

        function generateJson() {
            const id = document.getElementById('postId').value || 'new_event_' + Date.now();
            const title = document.getElementById('postTitle').value || 'Новое событие';
            const shortDesc = document.getElementById('postShort').value || '';
            const fullDesc = document.getElementById('postFull').value || '';
            const actionUrl = document.getElementById('postActionUrl').value || '#';
            const dateMode = document.getElementById('dateMode').value;
            const aiGreeting = document.getElementById('aiGreeting').value;

            let displayStart = "Скоро";
            let displayEnd = "Дата уточняется";
            let start = null;
            let end = null;

            if (dateMode === 'exact') {
                start = document.getElementById('dateStart').value || "2026-11-01";
                end = document.getElementById('dateEnd').value || "2026-11-10";
                displayStart = new Date(start).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                displayEnd = new Date(end).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            const keywords = {};
            document.querySelectorAll('.ai-qa-pair').forEach(pair => {
                const k = pair.querySelector('.ai-key').value.trim();
                const v = pair.querySelector('.ai-val').value.trim();
                if (k && v) keywords[k] = v;
            });

            const eventObj = {
                id: id,
                title: title,
                badge: document.getElementById('postType').value === 'news' ? 'newspaper' : 'event',
                is_new: true,
                dates: {
                    start: start,
                    end_original: null,
                    end: end,
                    display_start: displayStart,
                    display_end: displayEnd,
                    extended: false
                },
                description: {
                    short: shortDesc,
                    full: [fullDesc]
                },
                image: null,
                has_image: false,
                links: {
                    action_url: actionUrl,
                    ai_privacy_url: "#ai-privacy-modal"
                },
                user_interactions: { likes_count: 0, is_liked: false },
                attachments: [],
                ai_assistant: {
                    enabled: true,
                    name: "Ask Events (new)",
                    version: "v0.9",
                    status: "Active",
                    language: "ru",
                    context_title: title,
                    initial_message: aiGreeting,
                    quick_questions: [
                        { id: "q1", icon: "help_outline", text: "Что это за обновление?" }
                    ],
                    knowledge_base: {
                        keywords: keywords,
                        default: "Подробной информации по этому вопросу пока нет в базе знаний."
                    }
                }
            };

            document.getElementById('jsonOutput').value = JSON.stringify(eventObj, null, 2);
            navigator.clipboard.writeText(document.getElementById('jsonOutput').value);
            alert("JSON успешно сгенерирован и скопирован в буфер обмена! Можешь вставить его в events.json.");
        }
    </script>
</body>
</html>
