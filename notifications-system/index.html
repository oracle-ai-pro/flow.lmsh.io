<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Штаб ЛМСХ - Панель управления</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .main-btn { padding: 10px 20px; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card { background: white; padding: 20px; border-radius: 20px; width: 300px; margin: 10px auto; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .material-symbols-outlined { font-size: 28px; cursor: pointer; color: #6e8efb; }
        .material-symbols-outlined.active { color: #f44336; }
        .timer-info { font-size: 0.75em; color: #888; margin-top: 5px; }
        input { width: 40px; border: 1px solid #ccc; border-radius: 5px; padding: 2px; text-align: center; }
    </style>
</head>
<body>

    <div class="controls">
        <button class="main-btn" onclick="setAll(false)">Отключить все</button>
        <button class="main-btn" onclick="setAll(true)">Включить все</button>
    </div>

    <div id="cards-container"></div>

    <div class="info-section" style="margin-top: 20px; width: 300px; background: white; padding: 15px; border-radius: 15px; font-size: 0.9em;">
        <details>
            <summary>ℹ️ Как работают уведомления?</summary>
            <ul>
                <li>Разрешите уведомления в браузере.</li>
                <li>В настройках MIUI: Автозапуск ВКЛ, Контроль активности — Без ограничений.</li>
            </ul>
        </details>
    </div>

    <script>
        const members = [
            { id: 'lamirk', name: 'Ламирк', role: 'Главный инженер', timer: 5 },
            { id: 'murzik', name: 'Мурзик', role: 'Верная Помощница', timer: 10 },
            { id: 'snezhinka', name: 'Снежинка', role: 'Женский вокал', timer: 15 },
            { id: 'hakhmi', name: 'Хахми', role: 'Мужской вокал', timer: 20 }
        ];

        const container = document.getElementById('cards-container');

        function render() {
            container.innerHTML = '';
            members.forEach(member => {
                const isActive = localStorage.getItem('notify_' + member.id) === 'true';
                const savedTime = localStorage.getItem('time_' + member.id) || member.timer;
                const alarmTime = localStorage.getItem('alarm_' + member.id) || '';

                container.innerHTML += `
                    <div class="card" id="card-${member.id}">
                        <div>
                            <strong>${member.name}</strong>
                            <p style="font-size: 0.8em; color: #666;">${member.role}</p>
                            <input type="number" id="input-${member.id}" value="${savedTime}" onchange="updateTime('${member.id}')"> мин
                            <div class="timer-info" id="status-${member.id}">${isActive && alarmTime ? 'Уведомление в: ' + alarmTime : 'Выключено'}</div>
                        </div>
                        <span class="material-symbols-outlined ${isActive ? 'active' : ''}" 
                              onclick="toggleNotify('${member.id}')">
                              ${isActive ? 'notifications_active' : 'notifications'}
                        </span>
                    </div>
                `;
            });
        }

        function updateTime(id) {
            localStorage.setItem('time_' + id, document.getElementById('input-' + id).value);
        }

        function toggleNotify(id) {
            const isActive = document.querySelector(`#card-${id} .material-symbols-outlined`).classList.toggle('active');
            const minutes = document.getElementById('input-' + id).value;
            
            if (isActive) {
                const now = new Date();
                const alarm = new Date(now.getTime() + minutes * 60000);
                const timeString = alarm.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                localStorage.setItem('alarm_' + id, timeString);
                localStorage.setItem('notify_' + id, 'true');
                document.getElementById('status-' + id).innerText = 'Уведомление в: ' + timeString;
                
                setTimeout(() => showNotification("Штаб ЛМСХ", `Время вышло для ${members.find(m => m.id === id).name}!`), minutes * 60000);
            } else {
                localStorage.setItem('notify_' + id, 'false');
                document.getElementById('status-' + id).innerText = 'Выключено';
            }
            render(); // Перерисовка для иконок
        }

        function showNotification(title, body) {
            if (Notification.permission === 'granted') {
                new Notification(title, { body });
            } else {
                Notification.requestPermission();
            }
        }

        // Инициализация
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        render();
    </script>
</body>
</html>
