<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Event Assistant</title>
    <!-- Google Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f3f3;
            color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .chat-card {
            width: 100%;
            max-width: 650px;
            height: 680px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
            border: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 16px 20px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #00c6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .header-info h2 {
            font-size: 1.05em;
            font-weight: 600;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-info p {
            font-size: 0.8em;
            color: #888;
        }

        .status-badge {
            font-size: 0.75em;
            background: #eef7ff;
            color: #007aff;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Event Banner (Fixed Context) */
        .event-banner {
            background: #fafafa;
            border-bottom: 1px solid #eaeaea;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .event-badge-icon {
            background: #10b981;
            color: white;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .event-details {
            flex: 1;
        }

        .event-details .label {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #999;
            font-weight: 700;
        }

        .event-details .title {
            font-size: 0.9em;
            font-weight: 600;
            color: #2c3e50;
        }

        /* Chat Messages Container */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fcfcfc;
        }

        .chat-bubble-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 82%;
        }

        .chat-bubble-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .chat-bubble-wrapper.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .chat-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.93em;
            line-height: 1.5;
            position: relative;
        }

        .user .chat-bubble {
            background: #007aff;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .ai .chat-bubble {
            background: #f0f2f5;
            color: #1c1e21;
            border-bottom-left-radius: 4px;
        }

        /* AI Message Action Buttons */
        .message-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding-left: 2px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #8a8d91;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.78em;
            transition: all 0.2s ease;
        }

        .action-btn .material-symbols-outlined {
            font-size: 16px;
        }

        .action-btn:hover {
            background: #e4e6eb;
            color: #1c1e21;
        }

        .action-btn.liked {
            color: #007aff;
        }

        .action-btn.liked .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }

        .action-btn.reported {
            color: #e74c3c;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: #f0f2f5;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #8a8d91;
            border-radius: 50%;
            animation: blink 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* Quick Suggestions */
        .suggestions {
            display: flex;
            gap: 8px;
            padding: 0 20px 10px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .suggestions::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            color: #444;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8em;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chip:hover {
            background: #f0f7ff;
            border-color: #007aff;
            color: #007aff;
        }

        /* Chat Input Area */
        .chat-input-area {
            padding: 12px 20px 16px 20px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f4f5f7;
            border-radius: 24px;
            padding: 8px 16px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            background: #ffffff;
            border-color: #007aff;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .chat-input-area input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.92em;
            color: #2b2b2b;
        }

        .send-btn {
            background: #007aff;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: #0066d6;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn .material-symbols-outlined {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="chat-card">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <div class="ai-avatar">
                    <span class="material-symbols-outlined">smart_toy</span>
                </div>
                <div class="header-info">
                    <h2>Event AI Assistant</h2>
                    <p>Динамический ассистент событий</p>
                </div>
            </div>
            <div class="status-badge">Активен</div>
        </div>

        <!-- Fixed Event Context Banner -->
        <div class="event-banner">
            <div class="event-badge-icon">
                <span class="material-symbols-outlined">event</span>
            </div>
            <div class="event-details">
                <div class="label">Выбранное событие</div>
                <div class="title" id="eventTitle">Загрузка события...</div>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="chat-body" id="chatBody">
            
            <!-- Initial AI Greeting -->
            <div class="chat-bubble-wrapper ai">
                <div class="chat-bubble" id="initialGreeting">
                    Привет! Я твой AI-ассистент. Загружаю информацию о событии...
                </div>
                <div class="message-actions">
                    <button class="action-btn" onclick="toggleLike(this)">
                        <span class="material-symbols-outlined">thumb_up</span> Нравится
                    </button>
                    <button class="action-btn" onclick="toggleReport(this)">
                        <span class="material-symbols-outlined">flag</span> Пожаловаться
                    </button>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

        </div>

        <!-- Quick Question Chips -->
        <div class="suggestions">
            <div class="chip" onclick="sendQuickQuestion('Что нового приносит это событие?')">
                <span class="material-symbols-outlined">help_outline</span> Что нового?
            </div>
            <div class="chip" onclick="sendQuickQuestion('Почему это событие в Бете?')">
                <span class="material-symbols-outlined">science</span> Почему Бета?
            </div>
            <div class="chip" onclick="sendQuickQuestion('Какие предметы доступны?')">
                <span class="material-symbols-outlined">schedule</span> Доступные товары
            </div>
        </div>

        <!-- Input Box -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Задайте вопрос о событии..." onkeypress="handleKeyPress(event)">
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </div>

    <script>
        let currentEventData = null;

        // 1. Извлекаем ID события из URL параметра (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');

        // 2. Загружаем данные из events.json при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            if (eventId) {
                fetchEventDetails(eventId);
            } else {
                document.getElementById('eventTitle').innerText = "Событие не выбрано";
                document.getElementById('initialGreeting').innerText = "Привет! Задайте вопрос по интересующему вас событию.";
            }
        });

        async function fetchEventDetails(id) {
            try {
                const response = await fetch('events.json');
                const events = await response.json();
                
                // Находим нужное событие по id
                currentEventData = events.find(e => String(e.id) === String(id));

                if (currentEventData) {
                    const titleText = currentEventData.title || currentEventData.name || `Событие #${id}`;
                    document.getElementById('eventTitle').innerText = titleText;
                    document.getElementById('initialGreeting').innerHTML = 
                        `Привет! Я твой AI-ассистент. Мы сейчас обсуждаем <strong>"${escapeHtml(titleText)}"</strong>. Задавай любые вопросы!`;
                } else {
                    document.getElementById('eventTitle').innerText = `Событие #${id} не найдено`;
                    document.getElementById('initialGreeting').innerText = "К сожалению, данные по этому событию не найдены в базе.";
                }
            } catch (err) {
                console.error("Ошибка при загрузке events.json:", err);
                document.getElementById('eventTitle').innerText = "Ошибка загрузки";
                document.getElementById('initialGreeting').innerText = "Не удалось загрузить базу знаний событий.";
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendUserMessage(text);
            input.value = '';

            showTyping(true);

            setTimeout(() => {
                showTyping(false);
                const aiReplyText = getAiResponse(text);
                appendAiMessage(aiReplyText);
            }, 800);
        }

        function sendQuickQuestion(questionText) {
            document.getElementById('userInput').value = questionText;
            sendMessage();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function appendUserMessage(text) {
            const chatBody = document.getElementById('chatBody');
            const wrapper = document.createElement('div');
            wrapper.className = 'chat-bubble-wrapper user';
            wrapper.innerHTML = `<div class="chat-bubble">${escapeHtml(text)}</div>`;
            
            const typing = document.getElementById('typingIndicator');
            chatBody.insertBefore(wrapper, typing);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function appendAiMessage(text) {
            const chatBody = document.getElementById('chatBody');
            const wrapper = document.createElement('div');
            wrapper.className = 'chat-bubble-wrapper ai';
            
            wrapper.innerHTML = `
                <div class="chat-bubble">${text}</div>
                <div class="message-actions">
                    <button class="action-btn" onclick="toggleLike(this)">
                        <span class="material-symbols-outlined">thumb_up</span> Нравится
                    </button>
                    <button class="action-btn" onclick="toggleReport(this)">
                        <span class="material-symbols-outlined">flag</span> Пожаловаться
                    </button>
                </div>
            `;

            const typing = document.getElementById('typingIndicator');
            chatBody.insertBefore(wrapper, typing);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // Логика поиска ответов на основе загруженного события
        function getAiResponse(userText) {
            if (!currentEventData) {
                return "Информация о событии еще загружается или недоступна.";
            }

            const lower = userText.toLowerCase();

            // Поиск по ключевым словам события (если они есть в events.json)
            if (currentEventData.keywords) {
                for (let key in currentEventData.keywords) {
                    if (lower.includes(key.toLowerCase())) {
                        return currentEventData.keywords[key];
                    }
                }
            }

            // Запасные поля ответа (description / default / details)
            if (currentEventData.description) {
                return currentEventData.description;
            } else if (currentEventData.default) {
                return currentEventData.default;
            }

            return `О событии "${currentEventData.title || currentEventData.name}" известно следующее: оно сейчас активно в системе. Вы можете уточнить детали у администратора.`;
        }

        function showTyping(show) {
            const typing = document.getElementById('typingIndicator');
            typing.style.display = show ? 'flex' : 'none';
            if (show) {
                const chatBody = document.getElementById('chatBody');
                chatBody.scrollTop = chatBody.scrollHeight;
            }
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            if (btn.classList.contains('liked')) {
                btn.innerHTML = `<span class="material-symbols-outlined">thumb_up</span> Понравилось`;
            } else {
                btn.innerHTML = `<span class="material-symbols-outlined">thumb_up</span> Нравится`;
            }
        }

        function toggleReport(btn) {
            if (btn.classList.contains('reported')) {
                btn.classList.remove('reported');
                btn.innerHTML = `<span class="material-symbols-outlined">flag</span> Пожаловаться`;
            } else {
                btn.classList.add('reported');
                btn.innerHTML = `<span class="material-symbols-outlined">flag</span> Жалоба отправлена`;
                alert("Спасибо за отзыв. Ответ отправлен на проверку.");
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
