<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Prestige HQ | Штаб ЛМСХ</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        :root { --accent: #007bff; --bg: #050505; --card: #121212; --text: #fff; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }

        /* Лоадер */
        #lmsh-loader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #000; animation: fadeOut 0.3s forwards 2.0s; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* Контейнер формы */
        .container { padding: 40px; max-width: 600px; margin: auto; display: none; }
        
        /* Стили Помощника (Overlay) */
        #ai-overlay { 
            position: fixed; inset: 0; z-index: 8000; display: none; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            align-items: center; justify-content: center;
        }
        #ai-frame { width: 90%; max-width: 400px; height: 80vh; border-radius: 20px; overflow: hidden; border: 1px solid #333; }
        
        /* FAB Кнопка */
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; box-shadow: 0 0 20px rgba(0,123,255,0.5); }
    </style>
</head>
<body>

    <div id="lmsh-loader"><h1>ИНИЦИАЛИЗАЦИЯ...</h1></div>

    <!-- Основная форма -->
    <div class="container" id="main-form">
        <h2>Центр обращений ЛМСХ</h2>
        <form id="form-data">
            <!-- Твои поля формы из предыдущего кода -->
            <input type="text" id="user-name" placeholder="Ваше имя" required>
            <button type="submit">Отправить запрос</button>
        </form>
    </div>

    <!-- Контейнер для Помощника -->
    <div id="ai-overlay" onclick="toggleAI()">
        <div id="ai-frame" onclick="event.stopPropagation()">
            <!-- СЮДА ВСТАВЛЯЕШЬ ВЕСЬ HTML КОД ПОМОЩНИКА БЕЗ ТЕГОВ HTML/BODY -->
            <iframe srcdoc='<!DOCTYPE html>... (твой код помощника) ...' style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <div class="fab" onclick="toggleAI()">
        <span class="material-symbols-rounded">smart_toy</span>
    </div>

    <script>
        function toggleAI() {
            const overlay = document.getElementById('ai-overlay');
            overlay.style.display = (overlay.style.display === 'flex') ? 'none' : 'flex';
        }

        // Лоадер
        setTimeout(() => { document.getElementById('main-form').style.display = 'block'; }, 2100);
        
        document.getElementById('form-data').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // Элементы
    const btn = e.target.querySelector('button');
    const originalText = btn.innerText;
    btn.innerText = "ОТПРАВКА...";
    btn.disabled = true;

    const token = "8608018012:AAGXq5u1vgW3tbuq5bKB2p2gM5ubJFn_01A";
    const chatId = "5365364862";
    
    // Сбор данных
    const type = document.getElementById('type-select').value;
    const name = document.getElementById('user-name').value;
    const details = document.getElementById('q-text').value;
    
    // Формируем сообщение
    const text = `📬 *Новое обращение ЛМСХ*\n\n👤 *Имя:* ${name}\n📋 *Тип:* ${type}\n📝 *Описание:* ${details}`;
    
    try {
        const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                chat_id: chatId, 
                text: text, 
                parse_mode: 'Markdown' 
            })
        });

        if(res.ok) {
            alert("Обращение успешно доставлено в Штаб!");
            this.reset(); // Очистка формы
            updateCounter(document.getElementById('q-text')); // Сброс счетчика
        } else {
            alert("Ошибка связи со Штабом.");
        }
    } catch(err) {
        alert("Ошибка соединения. Проверь сеть.");
    } finally {
        btn.innerText = originalText;
        btn.disabled = false;
    }
});
    </script>
</body>
</html>
