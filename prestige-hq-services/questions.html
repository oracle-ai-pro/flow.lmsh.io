<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <title>Prestige HQ | Вопросы</title>
    <style>
        :root { --accent: #007bff; --bg: #050505; --card: #0a0a0a; --text: #fff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; }

        /* Лоадер */
        #lmsh-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; animation: fadeOut 0.5s forwards 2.0s; }
        .loader-box { width: 60px; height: 60px; border: 2px solid var(--accent); border-radius: 15px; animation: pulse 1.5s infinite; }
        .loader-text { margin-top: 20px; color: var(--accent); font-family: monospace; font-size: 12px; letter-spacing: 2px; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -60%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        .container { padding: 40px 20px; max-width: 500px; margin: auto; }
        input, textarea, select { width: 100%; margin: 10px 0; padding: 15px; background: var(--card); border: 1px solid #222; color: white; border-radius: 20px; outline: none; box-sizing: border-box; }

        .back-btn { background: transparent; color: #666; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        .action-bar { display: flex; gap: 10px; margin-top: 20px; }
        button { border: none; padding: 15px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-send { background: var(--accent); flex: 2; }
        .btn-check { background: #1a1a1a; border: 1px solid #444; flex: 1; }
    </style>
</head>
<body>

    <div id="lmsh-loader">
        <div class="loader-box"></div>
        <div class="loader-text">ИНИЦИАЛИЗАЦИЯ ШТАБА...</div>
    </div>

    <div class="container">
	<button class="back-btn" onclick="location.href='select-service.html'">← Назад</button>
        <h2>Новый Вопрос</h2>
        <form id="form-data">
            <input type="text" id="user-name" placeholder="Ваше имя" required>
            <select id="type-select">
                <option value="Вопрос">Вопрос</option>
                <option value="Проблема">Проблема</option>
            </select>
            <textarea id="q-text" placeholder="Опишите суть вопроса или проблему..." rows="5"></textarea>
            
            <div class="action-bar">
                <button type="button" class="btn-check" onclick="checkFields()">Проверить</button>
                <button type="submit" class="btn-send">Отправить</button>
            </div>
        </form>
    </div>

    <div class="ai-overlay">
        <div id="ai-bar" onclick="checkFields()" style="position:fixed; bottom:20px; right:20px; background:#0a0a0a; border:1px solid #007bff; padding:12px 20px; border-radius:30px; display:flex; align-items:center; gap:10px; cursor:pointer; color:white; box-shadow:0 10px 20px rgba(0,0,0,0.5);">
            <span class="material-symbols-rounded">smart_toy</span>
            <span>Помощник ЛМСХ</span>
        </div>
    </div>
        
    <script>
        setTimeout(() => { document.querySelector('.loader-text').innerText = 'Подключение'; }, 1000);

        async function checkFields() {
            const name = document.getElementById('user-name').value.trim();
            const text = document.getElementById('q-text').value.trim();
            
            showAIStatus("Анализ данных в Штабе...");
            await new Promise(resolve => setTimeout(resolve, 1500));

            const displayName = name || "У вас";
            if (text.length < 15) {
                showAIStatus(`${displayName}, описание слишком короткое. Добавьте деталей, чтобы я понял проблему!`);
            } else {
                showAIStatus(`${displayName}, всё чисто! Ваши Данные готовы к отправке.`);
            }
        }

        function showAIStatus(msg) {
            let bubble = document.getElementById('ai-bubble');
            if (!bubble) {
                bubble = document.createElement('div');
                bubble.id = 'ai-bubble';
                bubble.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.9); border:1px solid #007bff; padding:20px; border-radius:20px; z-index:10000; color:white; font-weight:bold; text-align:center; box-shadow:0 0 20px #007bff; animation:fadeIn 0.3s; width:80%; max-width:300px;";
                document.body.appendChild(bubble);
            }
            bubble.innerText = msg;
            bubble.style.display = 'block';
            setTimeout(() => { bubble.style.display = 'none'; }, 4000);
        }

        document.getElementById('form-data').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = "8608018012:AAGXq5u1vgW3tbuq5bKB2p2gM5ubJFn_01A";
            const chatId = "5365364862";
            const text = `📬 *Новое обращение ЛМСХ*\n👤 Имя: ${document.getElementById('user-name').value}\n📋 Тип: ${document.getElementById('type-select').value}\n📝 Описание: ${document.getElementById('q-text').value}`;
            
            const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
            });
            
            if(res.ok) { 
                showAIStatus("Сообщение отправлено");
                document.getElementById('form-data').reset();
            }
        });
    </script>
</body>
</html>
