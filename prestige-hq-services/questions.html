<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Prestige HQ | Вопросы</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        :root { --accent: #007bff; --bg: #050505; --card: #0a0a0a; --text: #fff; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; }

        /* Лоадер */
        #lmsh-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; animation: fadeOut 0.3s forwards 2.0s; }
        .loader-glow { width: 80px; height: 80px; border: 2px solid var(--accent); border-radius: 20px; box-shadow: 0 0 20px var(--accent); animation: pulse 1.5s infinite; }
        .loader-text { margin-top: 20px; color: var(--accent); font-family: monospace; font-size: 14px; letter-spacing: 2px; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Форма */
        .container { padding: 40px; max-width: 600px; margin: auto; display: none; }
        .back-btn { background: transparent; color: #666; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; }
        input, textarea, select { width: 100%; margin: 10px 0; padding: 15px; background: var(--card); border: 1px solid #222; color: white; border-radius: 25px; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 123, 255, 0.2); }
        .char-counter { font-size: 12px; color: #666; text-align: right; margin-top: -5px; margin-bottom: 10px; }
        button { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; border-radius: 25px; cursor: pointer; font-weight: bold; }

        /* FAB Button */
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 20px rgba(0, 123, 255, 0.5); z-index: 1000; color: white; }
        .fab:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="lmsh-loader">
        <div class="loader-glow"></div>
        <div class="loader-text" id="status-text">ИНИЦИАЛИЗАЦИЯ...</div>
    </div>

    <div class="container" id="main-form">
        <button class="back-btn" onclick="location.href='select-service.html'">← Назад</button>
        <h2>Вопросы или Проблемы</h2>
        <div class="maintenance-card">
    <div class="icon-glow">
        <span class="material-symbols-rounded">build</span>
    </div>
    <h3>Sorry! Has Error happenend</h3>
    <p>Мы обнаружили серьезную проблему. Временно недоступно.</p>
    <p>If do you need a question, please open titan system form!</p>
</div>

<style>
    .maintenance-card {
        background: #050505; /* Абсолютно черный */
        border: 1px solid #1a1a1a; /* Тонкая граница для глубины */
        border-radius: 30px; /* Сильное скругление */
        padding: 40px;
        text-align: center;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.5); /* Объемная тень */
        transition: 0.4s;
    }

    /* Цвет границы меняем тут */
    .maintenance-card:hover { border-color: #007bff; } 

    .icon-glow {
        width: 70px; height: 70px;
        background: rgba(0, 123, 255, 0.1);
        border-radius: 20px;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px auto;
    }
    .icon-glow span { font-size: 32px; color: #007bff; }
    
    h3 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    p { color: #666; font-size: 14px; }
</style>
    </div>

    <script>
        function updateCounter(el) {
            const count = el.value.length;
            document.getElementById('counter').innerText = `${count}/${el.maxLength}`;
        }
        
        // Статусы инициализации
        setTimeout(() => { document.getElementById('status-text').innerText = 'ПОДКЛЮЧЕНИЕ К ШТАБУ...'; }, 1000);
        setTimeout(() => { document.getElementById('main-form').style.display = 'block'; }, 2100);

        document.getElementById('form-data').addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = "8608018012:AAGXq5u1vgW3tbuq5bKB2p2gM5ubJFn_01A";
            const chatId = "5365364862";
            
            const type = document.getElementById('type-select').value;
            const name = document.getElementById('user-name').value;
            const email = document.getElementById('user-email').value;
            const details = type === 'Вопрос' ? document.getElementById('q-text').value : document.getElementById('p-text').value;
            
            const text = `📬 *Новое обращение ЛМСХ*\n👤 Имя: ${name}\n📧 Email: ${email}\n📋 Тип: ${type}\n📝 Описание: ${details}`;
            
            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
                });
                if(res.ok) { alert("Отправлено в Штаб!"); this.reset(); toggleBlocks(); }
                else { alert("Ошибка отправки."); }
            } catch(err) { alert("Ошибка связи с сервером."); }
        });
    </script>
</body>
</html>
