<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Prestige HQ | Идеи</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        :root { --accent: #28a745; --bg: #050505; --card: #0a0a0a; --text: #fff; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; }

        /* Живой лоадер (Зеленая инициализация) */
        #lmsh-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; animation: fadeOut 0.3s forwards 2.0s; }
        .loader-glow { width: 80px; height: 80px; border: 2px solid var(--accent); border-radius: 20px; box-shadow: 0 0 20px var(--accent); animation: pulse 1.5s infinite; }
        .loader-text { margin-top: 20px; color: var(--accent); font-family: monospace; font-size: 14px; letter-spacing: 2px; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Форма */
        .container { padding: 40px; max-width: 600px; margin: auto; display: none; }
        .back-btn { background: transparent; color: #666; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; }
        input, textarea, select { width: 100%; margin: 10px 0; padding: 15px; background: var(--card); border: 1px solid #222; color: white; border-radius: 20px; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(40, 167, 69, 0.2); }
        .char-counter { font-size: 12px; color: #666; text-align: right; margin-top: -5px; margin-bottom: 10px; }
        button { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        h2 { color: var(--accent); }
    </style>
</head>
<body>

    <div id="lmsh-loader">
        <div class="loader-glow"></div>
        <div class="loader-text" id="status-text">ИНИЦИАЛИЗАЦИЯ ИДЕЙ...</div>
    </div>

    <div class="container" id="main-form">
        <button class="back-btn" onclick="location.href='select-service.html'">← Назад</button>
        <h2>Предложить идею для Штаба</h2>
        <form id="idea-form">
            <input type="text" id="title" placeholder="Название идеи" required>
            
            <textarea id="desc" placeholder="Суть идеи (детально)" rows="4" maxlength="500" oninput="updateCounter(this, 'c1')" required></textarea>
            <div id="c1" class="char-counter">0/500</div>

            <textarea id="benefit" placeholder="Какую пользу принесет Штабу?" rows="3" maxlength="300" oninput="updateCounter(this, 'c2')" required></textarea>
            <div id="c2" class="char-counter">0/300</div>
            
            <select id="priority">
                <option value="Низкий">Приоритет: Низкий</option>
                <option value="Средний">Приоритет: Средний</option>
                <option value="Высокий">Приоритет: Высокий</option>
            </select>

            <input type="text" id="author" placeholder="Ваше имя" required>
            <button type="submit">Отправить в Штаб</button>
        </form>
    </div>

    <script>
        function updateCounter(el, id) {
            document.getElementById(id).innerText = `${el.value.length}/${el.maxLength}`;
        }

        // Логика инициализации
        setTimeout(() => { document.getElementById('status-text').innerText = 'ПОДКЛЮЧЕНИЕ К КАНАЛУ IDEAS...'; }, 1000);
        setTimeout(() => { document.getElementById('main-form').style.display = 'block'; }, 2100);

        // Отправка
        document.getElementById('idea-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = "8608018012:AAGXq5u1vgW3tbuq5bKB2p2gM5ubJFn_01A";
            const chatId = "5365364862";
            
            const text = `💡 *Новая идея для ЛМСХ*\n\n📌 *Название:* ${document.getElementById('title').value}\n📝 *Суть:* ${document.getElementById('desc').value}\n🚀 *Польза:* ${document.getElementById('benefit').value}\n⭐ *Приоритет:* ${document.getElementById('priority').value}\n👤 *Автор:* ${document.getElementById('author').value}`;
            
            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
                });
                if(res.ok) { alert("Идея в Штабе!"); this.reset(); }
                else { alert("Ошибка связи."); }
            } catch(err) { alert("Ошибка соединения."); }
        });
    </script>
</body>
</html>
