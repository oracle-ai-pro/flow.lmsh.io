<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Prestige HQ | Архив Идей</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        :root { --accent: #28a745; --bg: #050505; --card: #0a0a0a; --text: #fff; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; padding-bottom: 80px; }

        .container { max-width: 800px; margin: auto; }
        
        /* Шапка и Управление */
        .header-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .back-btn { background: transparent; color: #666; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-create { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; font-family: inherit; transition: 0.3s; }
        .btn-create:hover { box-shadow: 0 0 15px rgba(40, 167, 69, 0.4); }
        
        /* Поиск */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; }
        input[type="text"] { flex: 1; padding: 15px; background: var(--card); border: 1px solid #222; color: white; border-radius: 20px; outline: none; transition: 0.3s; font-family: inherit; }
        input[type="text"]:focus { border-color: var(--accent); }

        /* Карточки Идей */
        .ideas-grid { display: grid; gap: 20px; }
        .idea-card { background: #111; border: 1px solid #222; padding: 20px; border-radius: 20px; position: relative; overflow: hidden; transition: transform 0.2s; }
        .idea-card:hover { transform: translateY(-2px); border-color: #333; }
        .idea-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
        .idea-card.high-priority::before { background: #dc3545; }
        .idea-card.low-priority::before { background: #6c757d; }
        
        .idea-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .idea-author { font-size: 12px; color: #888; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .idea-desc { font-size: 14px; color: #ccc; line-height: 1.5; margin-bottom: 15px; }
        .idea-benefit { background: rgba(40, 167, 69, 0.1); padding: 10px; border-radius: 10px; font-size: 13px; color: var(--accent); }
        
        /* Кнопка Лайка */
        .like-btn { background: transparent; border: 1px solid #333; color: #888; padding: 8px 15px; border-radius: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; transition: 0.3s; font-family: inherit; font-weight: bold; }
        .like-btn:hover { border-color: var(--accent); color: var(--accent); }
        .like-btn.liked { background: rgba(40, 167, 69, 0.15); border-color: var(--accent); color: var(--accent); }
        .like-btn.liked .material-symbols-rounded { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-actions">
            <button class="back-btn" onclick="location.href='ideas.html'">← Назад</button>
            <h2 style="margin: 0; color: var(--accent);">Архив Инноваций</h2>
            <button class="btn-create" onclick="location.href='green-form.html'">
                <span class="material-symbols-rounded">add</span> Предложить
            </button>
        </div>

        <div class="filter-bar">
            <input type="text" placeholder="Поиск по названию или автору..." id="search-input" onkeyup="renderIdeas()">
        </div>

        <div class="ideas-grid" id="ideas-grid">
            </div>
    </div>

    <div class="ai-overlay">
        <div id="ai-bar" onclick="showAIStatus('Шеф, здесь хранятся все разработки. Ставь лайки лучшим идеям, и они сохранятся в памяти системы!')" style="position:fixed; bottom:20px; right:20px; background:#0a0a0a; border:1px solid var(--accent); padding:12px 20px; border-radius:30px; display:flex; align-items:center; gap:10px; cursor:pointer; color:white; box-shadow:0 10px 20px rgba(0,0,0,0.5);">
            <span class="material-symbols-rounded">smart_toy</span>
            <span>Помощник ЛМСХ</span>
        </div>
    </div>

    <script>
        // Имитация базы данных (пока не привяжем реальное сохранение из формы)
        const defaultIdeas = [
            { id: 101, title: "Интеграция LocalStorage", author: "Ламирк", date: "2 июля 2026", desc: "Сохранять историю отправленных логов и идей в локальную память браузера для быстрого доступа без интернета.", benefit: "Ускорит работу с архивом в 3 раза.", priority: "Высокий" },
            { id: 102, title: "Умная валидация Email", author: "Мурзик", date: "1 июля 2026", desc: "Добавить регулярные выражения для проверки правильности ввода электронной почты в зеленой форме.", benefit: "Избавит Штаб от спама и некорректных данных.", priority: "Средний" },
            { id: 103, title: "Редизайн кнопок навигации", author: "Хахми", date: "30 июня 2026", desc: "Сделать кнопки возврата более заметными, добавить им пульсацию при наведении.", benefit: "Улучшит UX на мобильных устройствах.", priority: "Низкий" }
        ];

        function getIdeas() {
            // В будущем мы будем брать идеи из localStorage
            // let stored = localStorage.getItem('hq_ideas');
            // return stored ? JSON.parse(stored) : defaultIdeas;
            return defaultIdeas;
        }

        function renderIdeas() {
            const grid = document.getElementById('ideas-grid');
            const searchStr = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = ''; 

            let ideas = getIdeas();
            let likedIdeas = JSON.parse(localStorage.getItem('likedIdeas')) || [];

            // Фильтрация поиска
            if (searchStr) {
                ideas = ideas.filter(i => i.title.toLowerCase().includes(searchStr) || i.author.toLowerCase().includes(searchStr));
            }

            if (ideas.length === 0) {
                grid.innerHTML = '<div style="text-align:center; color:#666; padding: 40px;">Идеи не найдены...</div>';
                return;
            }

            ideas.forEach(idea => {
                const isLiked = likedIdeas.includes(idea.id) ? 'liked' : '';
                
                // Назначаем класс приоритета для полоски слева
                let priorityClass = '';
                let priorityIcon = 'check_circle';
                let iconColor = 'var(--accent)';

                if (idea.priority === 'Высокий') {
                    priorityClass = 'high-priority';
                    priorityIcon = 'local_fire_department';
                    iconColor = '#dc3545';
                } else if (idea.priority === 'Низкий') {
                    priorityClass = 'low-priority';
                    priorityIcon = 'info';
                    iconColor = '#6c757d';
                }
                
                const cardHTML = `
                    <div class="idea-card ${priorityClass}">
                        <div class="idea-title">
                            ${idea.title}
                            <span class="material-symbols-rounded" style="color: ${iconColor};" title="Приоритет: ${idea.priority}">${priorityIcon}</span>
                        </div>
                        <div class="idea-author"><span class="material-symbols-rounded" style="font-size: 16px;">person</span> ${idea.author} • ${idea.date}</div>
                        <div class="idea-desc">${idea.desc}</div>
                        <div class="idea-benefit">🚀 Польза: ${idea.benefit}</div>
                        
                        <div style="margin-top: 15px; border-top: 1px solid #222; padding-top: 15px;">
                            <button class="like-btn ${isLiked}" onclick="toggleLike(${idea.id}, this)">
                                <span class="material-symbols-rounded">thumb_up</span> 
                                <span>Голосовать</span>
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function toggleLike(ideaId, btnElement) {
            let likedIdeas = JSON.parse(localStorage.getItem('likedIdeas')) || [];
            
            if (likedIdeas.includes(ideaId)) {
                // Убираем голос
                likedIdeas = likedIdeas.filter(id => id !== ideaId);
                btnElement.classList.remove('liked');
            } else {
                // Голосуем
                likedIdeas.push(ideaId);
                btnElement.classList.add('liked');
            }
            
            localStorage.setItem('likedIdeas', JSON.stringify(likedIdeas));
        }

        // Помощник
        function showAIStatus(msg) {
            let bubble = document.getElementById('ai-bubble');
            if (!bubble) {
                bubble = document.createElement('div');
                bubble.id = 'ai-bubble';
                bubble.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.95); border:1px solid var(--accent); padding:20px; border-radius:20px; z-index:10000; color:white; font-weight:bold; text-align:center; box-shadow:0 0 30px rgba(40,167,69,0.4); width:80%; max-width:320px;";
                document.body.appendChild(bubble);
            }
            bubble.innerText = msg;
            bubble.style.display = 'block';
            setTimeout(() => { bubble.style.display = 'none'; }, 4000);
        }

        // Запуск
        window.onload = renderIdeas;
    </script>
</body>
</html>
