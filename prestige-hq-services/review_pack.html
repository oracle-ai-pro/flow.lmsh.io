<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN REVIEWS: Early Access</title>
    <style>
        :root { --accent: #00aaff; --bg: #050505; --card: #0a0a0a; }
        
        body {
            font-family: Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Живой лоадер TITAN */
        #lmsh-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; animation: fadeOut 0.3s forwards 2.0s; }
        .loader-glow { width: 80px; height: 80px; border: 2px solid var(--accent); border-radius: 20px; box-shadow: 0 0 20px rgba(0, 170, 255, 0.5); animation: pulse 1.5s infinite; }
        .loader-text { margin-top: 20px; color: var(--accent); font-family: monospace; font-size: 14px; letter-spacing: 2px; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -60%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        /* Контейнер панели */
        .container {
            background: var(--card);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 0 25px rgba(0, 170, 255, 0.1), 0 15px 50px rgba(0,0,0,0.9);
            width: 100%;
            max-width: 450px;
            border: 1px solid #1a1a1a;
            box-sizing: border-box;
            display: none;
        }
        
        /* Кнопка Назад */
        .back-btn { background: transparent; color: #666; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; transition: 0.3s; font-size: 12px; }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        h2 { color: var(--accent); text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; font-size: 18px; margin-top: 0; }
        label { display: block; margin-left: 15px; margin-bottom: 7px; font-size: 12px; color: #666; text-transform: uppercase; }

        /* Легендарные капсулы */
        input, select {
            width: 100%;
            padding: 15px 25px;
            margin-bottom: 20px;
            border: 1px solid #222;
            border-radius: 50px;
            background: #111;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 170, 255, 0.25); }

        textarea {
            width: 100%;
            padding: 15px 25px;
            margin-bottom: 20px;
            border: 1px solid #222;
            border-radius: 20px;
            background: #111;
            color: white;
            box-sizing: border-box;
            outline: none;
            height: 100px;
            resize: none;
            transition: 0.3s;
        }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 170, 255, 0.25); }

        /* ИНТЕРАКТИВНЫЕ ЗВЕЗДЫ */
        .stars-container {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            margin-bottom: 25px;
            gap: 10px;
        }
        .stars-container input { display: none; }
        .stars-container label {
            font-size: 35px;
            color: #222;
            cursor: pointer;
            transition: 0.2s;
            margin: 0;
        }
        .stars-container label:before { content: '★'; }
        .stars-container input:checked ~ label,
        .stars-container label:hover,
        .stars-container label:hover ~ label {
            color: var(--accent);
            text-shadow: 0 0 15px rgba(0, 170, 255, 0.6);
        }

        /* Двухъядерная панель кнопок */
        .btn-group { display: flex; gap: 15px; margin-top: 5px; }
        button { flex: 1; padding: 16px; border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; box-sizing: border-box; font-size: 13px; }
        
        .btn-primary { background: linear-gradient(90deg, #0055ff, #00ccff); color: white; border: none; box-shadow: 0 5px 15px rgba(0, 85, 255, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .btn-primary:disabled { background: #222; color: #444; cursor: not-allowed; box-shadow: none; transform: none; filter: none; }
        
        .btn-secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-secondary:hover { background: rgba(0, 170, 255, 0.1); }

        #success { display: none; text-align: center; }
        #success h3 { color: #4CAF50; text-transform: uppercase; margin-top: 0; }
    </style>
</head>
<body>

<div id="lmsh-loader">
    <div class="loader-glow"></div>
    <div class="loader-text" id="status-text">ИНИЦИАЛИЗАЦИЯ TITAN REVIEWS...</div>
</div>

<div class="container" id="form-box">
    <button class="back-btn" onclick="location.href='select-service.html'">← Назад</button>
    <h2>Отзыв: Early Access ⚙️</h2>
    
    <form id="review-form">
        <label>Твой никнейм в штабе:</label>
        <input type="text" id="nickname" placeholder="Введите ник..." required>

        <label>Версия продукта:</label>
        <select id="version" required>
            <option value="3.4">Kosmo 3.4 (Актуальная)</option>
            <option value="3.3">3.3</option>
            <option value="3.2">3.2</option>
            <option value="3.1">3.1</option>
            <option value="3.0">3.0</option>
            <option value="2.9">2.9</option>
            <option value="2.8">2.8</option>
            <option value="2.5">2.5</option>
            <option value="2.2">2.2</option>
            <option value="2.0">2.0</option>
            <option value="1.0">1.0 (Олд)</option>
        </select>

        <label style="text-align: center; margin-bottom: 10px;">Твоя оценка системы:</label>
        <div class="stars-container">
            <input type="radio" id="star5" name="stars" value="5"><label for="star5"></label>
            <input type="radio" id="star4" name="stars" value="4"><label for="star4"></label>
            <input type="radio" id="star3" name="stars" value="3"><label for="star3"></label>
            <input type="radio" id="star2" name="stars" value="2"><label for="star2"></label>
            <input type="radio" id="star1" name="stars" value="1" required><label for="star1"></label>
        </div>

        <label>Почему такая оценка?</label>
        <textarea id="reason" placeholder="Что улучшить? Что понравилось?"></textarea>

        <div class="btn-group">
            <button type="button" class="btn-secondary" onclick="checkReport()">Проверить</button>
            <button type="submit" class="btn-primary" id="submit-btn">Отправить отчет</button>
        </div>
    </form>

    <div id="success">
        <h3>Отчет доставлен</h3>
        <p style="font-size: 13px; color: #888;">Никнейм верифицирован. Данные внесены в базу ЛМСХ.</p>
        <button onclick="location.reload()" style="background: #111; border: 1px solid #333; color: white; margin-top: 15px; font-size: 11px; width: auto; padding: 10px 20px;">Назад</button>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwb3ORaGdBVfRNYNRc-FsCRHFTooWzhspB07LS6CywwRQnsX8W6wNLuPcWclZih6Rl/exec';

    // Подгрузка никнейма автора из кэша Штаба при старте
    window.addEventListener('DOMContentLoaded', () => {
        const savedNickname = localStorage.getItem('lmsh-author');
        if (savedNickname) {
            document.getElementById('nickname').value = savedNickname;
        }
    });

    // Логика переключения лоадера
    setTimeout(() => { document.getElementById('status-text').innerText = 'СИНХРОНИЗАЦИЯ С ШЛЮЗОМ...'; }, 1000);
    setTimeout(() => { document.getElementById('form-box').style.display = 'block'; }, 2100);

    // Фирменный AI-баббл TITAN REVIEWS
    function showAIStatus(msg) {
        let bubble = document.getElementById('ai-bubble');
        if (!bubble) {
            bubble = document.createElement('div');
            bubble.id = 'ai-bubble';
            bubble.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.95); border:1px solid var(--accent); padding:20px; border-radius:20px; z-index:10000; color:white; font-weight:bold; text-align:center; box-shadow:0 0 30px rgba(0, 170, 255, 0.4); animation:fadeIn 0.3s; width:80%; max-width:320px; line-height: 1.5;";
            document.body.appendChild(bubble);
        }
        bubble.innerHTML = msg.replace(/\n/g, '<br>');
        bubble.style.display = 'block';
        setTimeout(() => { bubble.style.display = 'none'; }, 4000);
    }

    // Интеллектуальная пред-проверка отчета
    function checkReport() {
        const nickname = document.getElementById('nickname').value.trim();
        const version = document.getElementById('version').value;
        const starChecked = document.querySelector('input[name="stars"]:checked');
        const reason = document.getElementById('reason').value.trim();

        if (!nickname) {
            showAIStatus("Система TITAN: Идентификация провалена. Укажи свой никнейм!");
            return;
        }
        if (!starChecked) {
            showAIStatus("Система TITAN: Выстави оценку системе по звездной шкале!");
            return;
        }
        
        const stars = starChecked.value;
        if (stars <= 3 && reason.length < 10) {
            showAIStatus("Шеф, при низкой оценке добавь в поле описания конкретики, чтобы мы знали, что чинить.");
            return;
        }

        showAIStatus(`Валидация успешна!\nОтчет готов.\nНик: ${nickname}\nВерсия: ${version}\nОценка: ${stars}/5`);
    }

    // Финальный перехват отправки формы
    document.getElementById('review-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const nicknameVal = document.getElementById('nickname').value.trim();
        
        // Синхронизируем никнейм автора в общий кэш
        localStorage.setItem('lmsh-author', nicknameVal);

        btn.disabled = true;
        btn.innerText = "СИНХРОНИЗАЦИЯ...";

        const starsValue = document.querySelector('input[name="stars"]:checked').value;

        const data = {
            nickname: nicknameVal,
            version: document.getElementById('version').value,
            stars: starsValue,
            reason: document.getElementById('reason').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(data)
        }).then(() => {
            document.getElementById('review-form').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        }).catch(() => {
            showAIStatus("Ошибка TITAN:\nКанал связи заблокирован шлюзом.");
            btn.disabled = false;
            btn.innerText = "ОТПРАВИТЬ ОТЧЕТ";
        });
    });
</script>

</body>
</html>
