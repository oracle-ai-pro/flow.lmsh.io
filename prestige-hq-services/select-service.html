<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Prestige HQ | Штаб ЛМСХ</title>
    <style>
        body { margin: 0; background: #0f0f0f; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Логотип */
        .logo { width: 150px; height: 150px; margin-bottom: 40px; border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; max-width: 900px; }
        
        .card { 
            padding: 30px; border-radius: 15px; text-align: center; cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #333; background: #1a1a1a;
        }
        .card:hover { transform: translateY(-10px); border-color: #555; background: #222; }
        
        .card-blue:hover { box-shadow: 0 0 20px rgba(0, 123, 255, 0.3); }
        .card-green:hover { box-shadow: 0 0 20px rgba(40, 167, 69, 0.3); }
        .card-gold:hover { box-shadow: 0 0 20px rgba(255, 193, 7, 0.3); }
        
        .card-blue { border-top: 5px solid #007bff; }
        .card-green { border-top: 5px solid #28a745; }
        .card-gold { border-top: 5px solid #ffc107; }
        
        h3 { margin: 10px 0; }
        p { color: #888; font-size: 0.9em; }
    </style>
</head>
<body>

    <img src="logo.png" alt="LMSH Logo" class="logo">

    <div class="dashboard">
        <div class="card card-blue" onclick="location.href='questions.html'">
            <h3>Вопросы</h3>
            <p>Техническая поддержка</p>
        </div>
        <div class="card card-green" onclick="location.href='ideas.html'">
            <h3>Идеи</h3>
            <p>Развитие ЛМСХ</p>
        </div>
        <div class="card card-gold" onclick="location.href='reviews.html'">
            <h3>Отзывы</h3>
            <p>Мнение о системе</p>
        </div>
    </div>

</body>
</html>
