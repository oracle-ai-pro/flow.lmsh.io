<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prestige HQ | Dashboard</title>
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Неоновый Логотип */
        .logo { width: 150px; height: 150px; margin-bottom: 40px; border-radius: 20px; 
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.1); border: 2px solid #333; }
        
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; width: 100%; max-width: 800px; }
        
        .card { 
            padding: 30px; border-radius: 20px; text-align: center; cursor: pointer;
            transition: all 0.4s ease; background: #0a0a0a; border: 1px solid #222;
            position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-5px); }
        
        /* Неоновое свечение */
        .card-blue:hover { box-shadow: 0 0 25px #007bff; border-color: #007bff; }
        .card-green:hover { box-shadow: 0 0 25px #28a745; border-color: #28a745; }
        .card-gold:hover { box-shadow: 0 0 25px #ffc107; border-color: #ffc107; }
        .card-purple:hover { box-shadow: 0 0 25px #7C3AED; border-color: #7C3AED; }
        
        h3 { margin: 10px 0; letter-spacing: 1px; }
        p { color: #aaa; font-size: 0.85em; }
    </style>
</head>
<body>

    <img src="image.png" alt="LMSH Logo" class="logo">

    <div class="dashboard">
        <div class="card card-blue" onclick="location.href='questions.html'">
            <h3>Вопросы / Проблемы</h3>
            <p>Техподдержка Штаба</p>
        </div>
        <div class="card card-green" onclick="location.href='ideas.html'">
            <h3>Предложить Идею</h3>
            <p>Инновации для Prestige HQ</p>
        </div>
        <div class="card card-gold" onclick="location.href='reviews.html'">
            <h3>Отзывы</h3>
            <p>Оцените нашу работу</p>
        </div>
        <div class="card card-purple" onclick="location.href='upload_pack.html'">
            <h3>Опубликовать Пак</h3>
            <p>Ремиксы и ваш контент</p>
        </div>
    </div>

</body>
</html>
