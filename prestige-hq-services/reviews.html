<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prestige HQ | Отзывы</title>
    <style>
        :root { --accent: #ffc107; --bg: #050505; --card: #0a0a0a; --text: #fff; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; }

        /* Живой лоадер (Золотая инициализация) */
        #lmsh-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; animation: fadeOut 0.3s forwards 2.0s; }
        .loader-glow { width: 80px; height: 80px; border: 2px solid var(--accent); border-radius: 20px; box-shadow: 0 0 20px var(--accent); animation: pulse 1.5s infinite; }
        .loader-text { margin-top: 20px; color: var(--accent); font-family: monospace; font-size: 14px; letter-spacing: 2px; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Форма */
        .container { padding: 40px; max-width: 600px; margin: auto; display: none; }
        .back-btn { background: transparent; color: #666; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; }
        input, textarea, select { width: 100%; margin: 10px 0; padding: 15px; background: var(--card); border: 1px solid #222; color: white; border-radius: 20px; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 193, 7, 0.2); }
        .char-counter { font-size: 12px; color: #666; text-align: right; margin-top: -5px; margin-bottom: 10px; }
        button { background: var(--accent); color: #000; border: none; padding: 15px; width: 100%; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        h2 { color: var(--accent); }
    </style>
</head>
<body>

    <div id="lmsh-loader">
        <div class="loader-glow"></div>
        <div class="loader-text" id="status-text">ИНИЦИАЛИЗАЦИЯ ОТЗЫВОВ...</div>
    </div>

    <div class="container" id="main-form">
        <button class="back-btn" onclick="location.href='select-service.html'">← Назад</button>
        <h2>Ваше мнение о Prestige HQ</h2>
        <form id="review-form">
            <select id="rating" required>
                <option value="5">⭐⭐⭐⭐⭐ (Отлично)</option>
                <option value="4">⭐⭐⭐⭐ (Хорошо)</option>
                <option value="3">⭐⭐⭐ (Нормально)</option>
                <option value="2">⭐⭐ (Плохо)</option>
                <option value="1">⭐ (Ужасно)</option>
            </select>

            <input type="text" id="user-name" placeholder="Ваше имя" required>
            <input type="email" id="user-email" placeholder="Ваш Email" required>
            
            <textarea id="feedback" placeholder="Ваш опыт работы с ЛМСХ..." rows="5" maxlength="600" oninput="updateCounter(this)" required></textarea>
            <div id="counter" class="char-counter">0/600</div>

            <button type="submit">Оставить золотой отзыв</button>
        </form>
    </div>

    <script>
        function updateCounter(el) {
            document.getElementById('counter').innerText = `${el.value.length}/${el.maxLength}`;
        }

        // Логика инициализации
        setTimeout(() => { document.getElementById('status-text').innerText = 'ПОДКЛЮЧЕНИЕ К СИСТЕМЕ...'; }, 1000);
        setTimeout(() => { document.getElementById('main-form').style.display = 'block'; }, 2100);

        // Отправка
        document.getElementById('review-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = "8608018012:AAGXq5u1vgW3tbuq5bKB2p2gM5ubJFn_01A";
            const chatId = "5365364862";
            
            const rating = document.getElementById('rating').value;
            const text = `⭐ *Новый отзыв о Prestige HQ*\n\n🌟 *Рейтинг:* ${rating}/5\n👤 *Имя:* ${document.getElementById('user-name').value}\n📧 *Email:* ${document.getElementById('user-email').value}\n📝 *Отзыв:* ${document.getElementById('feedback').value}`;
            
            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
                });
                if(res.ok) { alert("Золотой отзыв доставлен!"); this.reset(); }
                else { alert("Ошибка связи со Штабом."); }
            } catch(err) { alert("Ошибка соединения."); }
        });
    </script>
</body>
</html>
